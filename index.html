<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-container">
        <div class="black-strip">
          <div class="odin-logo">
            <img src="images/odin-lined.png" alt="Odin Logo" />
            <div class="text-div">
              <p class="odin-text">ODIN</p>
            </div>
          </div>
        </div>
        <div class="credit">
          <p>
            Image Credits to
            <a href="https://unsplash.com/@haliewestphoto">Halie West</a> from
            <a href="https://unsplash.com">Unsplash</a>
          </p>
        </div>
      </div>
      <div class="right-container">
        <div class="hero-section">
          <div class="random-para">
            <p>
              This is not a real online service! You know you need something
              like this in your life to help you realize your deepest dream.
              Sign up <em>now</em> to get started.<br /><br />You
              <em>know</em> you want to.
            </p>
          </div>
        </div>
        <div class="signup-form">
          <h3>Let's Do This.</h3>
          <form action="" method="post">
            <div class="form-field">
              <label for="first_name">FIRST NAME</label>
              <input type="text" class="form-input" id="first_name" />
            </div>

            <div class="form-field">
              <label for="last_name">LAST NAME</label>
              <input type="text" class="form-input" id="last_name" />
            </div>

            <div class="form-field">
              <label for="email">EMAIL</label>
              <input type="email" class="form-input" id="email" />
            </div>

            <div class="form-field">
              <label for="phone-number">PHONE NUMBER</label>
              <input type="tel" class="form-input" id="phone-number" />
            </div>

            <div class="form-field">
              <label for="password">PASSWORD</label>
              <input
                type="password"
                class="form-input pwd"
                id="password"
                required
                minlength="8"
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
              />
            </div>

            <div class="form-field">
              <label for="confirm-password">CONFIRM PASSWORD</label>
              <input
                type="password"
                class="form-input pwd"
                id="confirm-password"
                required
                minlength="8"
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
              />
            </div>
          </form>
        </div>

        <div class="cta-section">
          <button class="create-ac-btn">Create Account</button>
          
          <p>Already have an Account ? <a href="">Log in</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
